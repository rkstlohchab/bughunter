[package]
name = "bughunter-claudex"
version = "0.1.0"
description = "BugHunterClaudex research workbench"
authors = ["BugHunterClaudex"]
edition = "2021"

[lib]
name = "bughunter_claudex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1.38", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
